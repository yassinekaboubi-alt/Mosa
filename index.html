/* ---------- Zia · Modules ---------- */
.zhero{display:flex;align-items:center;gap:22px;margin-top:18px}
.zring{position:relative;width:132px;height:132px;flex:none}
.zring svg{width:100%;height:100%;display:block}
.zring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.zring b{font:400 2.4rem/1 var(--serif)}.zring b small{font-size:1.1rem;color:var(--muted)}
.zring span{font-size:.6875rem;font-weight:600;color:var(--muted);margin-top:4px;max-width:90px;line-height:1.25}
.zside{flex:1;min-width:0}
.zph{flex:1;display:flex;flex-direction:column;gap:6px}
.zph div{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;border-radius:12px;background:var(--surface);opacity:.55}
.zph div.cur{opacity:1;box-shadow:inset 0 0 0 1.5px var(--mint)}.zph div.ok{opacity:.8}
.zph b{font:400 1.15rem var(--serif)}.zph span{font-size:.6875rem;color:var(--muted)}
.zdays{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:16px}
.zdays i{aspect-ratio:1;border-radius:50%;background:var(--raise)}
.zdays i.half{background:color-mix(in srgb,var(--gold) 40%,var(--raise))}.zdays i.on{background:var(--gold)}
.zdays i.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--gold)}
.check.off{opacity:.5}
.zlbl{display:block;margin:14px 0 6px;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
textarea{width:100%;border:0;border-radius:14px;background:var(--surface);color:var(--ink);padding:12px 14px;font:inherit;resize:vertical}
textarea:focus{outline:2px solid var(--gold)}
.hstory{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.hstory button{aspect-ratio:1;border-radius:50%;background:var(--surface);min-height:0;padding:0;font-size:.6875rem;font-weight:600;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--orbit)}
.hstory button[aria-pressed="true"]{background:linear-gradient(135deg,var(--rose),var(--gold));color:var(--surface);box-shadow:none}
.hstory button:disabled{opacity:.35}
.hchart{display:block;width:100%;height:auto;margin-top:12px;overflow:visible}
.bpal{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.bp{border-radius:16px;background:var(--surface);overflow:hidden}
.bp.lock{opacity:.5}
.bph{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;min-height:54px}
.bph i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.8125rem;font-weight:700;background:var(--raise);color:var(--muted)}
.bph i svg{width:14px;height:14px;stroke:var(--surface);stroke-width:3;fill:none}
.bp.ok .bph i{background:var(--mint)}
.bp.open .bph i{background:var(--gold);color:var(--gold-ink)}
.bph b{flex:1;font-weight:600}
.bpb{padding:0 16px 16px}
.bpb ul{margin:0 0 10px;padding-left:1.1em;line-height:1.55}
.bpb textarea{background:var(--raise);margin-top:10px}
.bps{margin:0 0 10px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);font:400 1.05rem/1.4 var(--serif)}
.lvls{grid-template-columns:repeat(2,minmax(0,1fr))}
.lgrid.words{grid-template-columns:repeat(3,minmax(0,1fr))}
.ltile.lw{aspect-ratio:auto;padding:10px 4px;font-size:1.7rem}
.ltip4{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface);line-height:1.6}
/* Détails : récompenses en grains de grenade et pétales, lucioles, croissant */
.fx i{width:7px;height:9px;left:-3.5px;top:-4.5px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7) 0 16%,transparent 18%),#F0566F}
.fx i:nth-child(3n){background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7) 0 16%,transparent 18%),#74A7FF}
.fx i:nth-child(4n){width:9px;height:6px;border-radius:60% 0 60% 0;background:#FF9A86}
.gmoon{fill:var(--gold-hi);opacity:.8}
[data-mode="light"] .gmoon{display:none}
.flies circle{fill:var(--gold-hi);filter:drop-shadow(0 0 3px var(--gold));animation:fly 9s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0);opacity:.2}25%{opacity:.9}50%{transform:translate(8px,-10px);opacity:.5}75%{transform:translate(-6px,-4px);opacity:1}}
@media (prefers-reduced-motion: reduce){.flies circle{animation:none;opacity:.7}}

/* ---------- Journal de test ---------- */
.tjcard{margin-top:18px;padding:16px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--gold)}
.tjcard .zlbl{display:block;margin:14px 0 6px;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.tjcard textarea{width:100%;border:0;border-radius:12px;background:var(--raise);color:var(--ink);padding:10px 12px;font:inherit}
.tjnote{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.tjnote button{aspect-ratio:1;min-height:0;padding:0;border-radius:10px;background:var(--raise);font-weight:600;font-size:.8125rem;color:var(--ink-2)}
.tjnote button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}

/* ---------- Mes retours ---------- */
.tjfb{margin-top:16px;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.tjfbb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tjfbb .chip{min-height:40px;justify-content:center}
/* ---------- Thèmes ---------- */
.thgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.thsw{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:14px;background:var(--surface);text-align:left;font-size:.8125rem;font-weight:600;min-height:0;box-shadow:inset 0 0 0 1px var(--line)}
.thsw[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--gold)}
.thdots{display:flex;gap:4px}.thdots i{width:18px;height:18px;border-radius:50%}
.thpick{display:grid;gap:8px;margin-top:10px}
.thpick label{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:.875rem}
.thpick small{display:block;font-weight:500;font-size:.75rem;color:var(--muted)}
.thpick input[type=color]{flex:none;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;-webkit-appearance:none;appearance:none}
.thpick input[type=color]::-webkit-color-swatch-wrapper{padding:0}.thpick input[type=color]::-webkit-color-swatch{border:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

/* ---------- Mosa · l'île ---------- */
:root{--ile-sky0:#F2B98A;--ile-sky1:#F6C88F;--ile-sky2:#F8E1BC;--ile-sea1:#7FD3CF;--ile-sea2:#3AA8AE;--ile-sea3:#1E7D88;--ile-karst:#5E8C7A;--ile-bird:#5A3E2E}
:root[data-mode="dark"]{--ile-sky0:#1A1530;--ile-sky1:#3B2A4F;--ile-sky2:#C86B4A;--ile-sea1:#1D6A73;--ile-sea2:#0C3A44;--ile-sea3:#061A20;--ile-karst:#2A3B44;--ile-bird:#1A1220}
.ile{margin:6px -8px 0}.ile svg{display:block;width:100%;height:auto;border-radius:22px}
.villa{cursor:pointer;outline:none}.villa:active{opacity:.75}
.vn{font-size:10.5px;font-weight:700;fill:#FFFFFF;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:3px}
.vtrk{fill:rgba(255,255,255,.3)}.vbar{fill:#FFD27A}
.waves path{animation:wave 6s ease-in-out infinite}
.longtail{animation:boat 7s ease-in-out infinite}@keyframes boat{50%{transform:translate(10px,-2px)}}
.ile svg{box-shadow:0 18px 40px -20px rgba(0,0,0,.6)}.waves path:nth-child(2n){animation-delay:-3s}
@keyframes wave{50%{transform:translateX(8px)}}
@media (prefers-reduced-motion: reduce){.waves path,.longtail{animation:none}}
/* ---------- Mosa · l'île en plein écran ---------- */
body.ile-on{background:var(--ile-sea3)}
.ilebg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ilebg svg{width:100%;height:100%;display:block}
body.ile-on #app>*:not(.ilebg){position:relative;z-index:1}
body.ile-on .ile{margin:0 -20px}
/* Dans les modules : le même décor, adouci par un voile pour que tout reste lisible */
body.ile-soft .ilebg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 52%,transparent) 0%,color-mix(in srgb,var(--bg) 80%,transparent) 26%,color-mix(in srgb,var(--bg) 84%,transparent) 100%);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
body.ile-soft .group,body.ile-soft .card,body.ile-soft .pjcard,body.ile-soft .bzsess,body.ile-soft .bzout div,body.ile-soft .hcard,body.ile-soft .mppick,body.ile-soft .dkstats div,body.ile-soft .sqcard,body.ile-soft .zkcard,body.ile-soft .plancard,body.ile-soft .bp,body.ile-soft .lcard{background:color-mix(in srgb,var(--surface) 70%,transparent)!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
body.ile-soft .seg{background:color-mix(in srgb,var(--seg-bg) 75%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
body.ile-on .ile svg{border-radius:0;box-shadow:none}
.bw{animation:bw 7s ease-in-out infinite}.bw.b1{animation-duration:9s;animation-delay:-3s}.bw.b2{animation-duration:11s;animation-delay:-6s}
@keyframes bw{50%{transform:translateX(14px)}}
.bs{animation:bs 3.5s ease-in-out infinite;opacity:0}@keyframes bs{40%{opacity:.8}80%{opacity:0}}
.refl{animation:refl 5s ease-in-out infinite}@keyframes refl{50%{opacity:.6}}
.boat1{animation:boat1 46s linear infinite}@keyframes boat1{0%{transform:translate(-120px,420px)}100%{transform:translate(460px,440px)}}
.boat2{animation:boat2 64s linear infinite;animation-delay:-20s}@keyframes boat2{0%{transform:translate(460px,300px)}100%{transform:translate(-90px,290px)}}
.mk{transform-box:view-box;animation:mk 2.6s ease-in-out infinite alternate}@keyframes mk{from{transform:rotate(-16deg)}to{transform:rotate(18deg)}}
.birds{animation:birds 38s linear infinite}@keyframes birds{0%{transform:translate(-60px,110px)}100%{transform:translate(460px,70px)}}
.glass,.glasswrap .tjfb,.glasswrap .tjcard{background:color-mix(in srgb,var(--surface) 62%,transparent)!important;-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 28%,transparent),0 20px 40px -26px rgba(0,0,0,.7)!important;border-radius:var(--r)}
.glass{margin-top:16px;padding:16px 16px 6px}
.glass .today-item:last-child{border-bottom:0}
body.ile-on .page-head h1,body.ile-on .page-head p{text-shadow:0 1px 12px color-mix(in srgb,var(--bg) 55%,transparent)}
@media (prefers-reduced-motion: reduce){.bw,.bs,.refl,.boat1,.boat2,.mk,.birds{animation:none}.boat1{transform:translate(60px,430px)}.boat2{transform:translate(250px,295px)}.birds{transform:translate(120px,90px)}}
/* ---------- Mosa · Business ---------- */
.bzout{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.bzout div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--surface);text-align:center}
.bzout b{font:400 1.5rem/1.1 var(--serif)}.bzout span{font-size:.6875rem;color:var(--muted);line-height:1.2}
section .bzout{grid-template-columns:repeat(3,minmax(0,1fr))}
.bzweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:80px;margin-top:14px;align-items:end}
.bzweek div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bzweek i{width:100%;min-height:3px;border-radius:6px 6px 2px 2px;background:var(--gold);opacity:.7}.bzweek .today i{opacity:1}
.bzweek span{font-size:.6875rem;color:var(--muted);text-transform:capitalize}
.bzsess{margin-top:16px;padding:16px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--gold)}
.bzres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.bzres .chip{justify-content:center;min-height:46px}
.bzpro{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.bzpm{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 0;text-align:left;min-height:0}
.bzedit{padding:10px 0 14px;border-bottom:1px solid var(--line)}
.bzform{display:grid;gap:8px;margin-top:12px}
.bzform input,.bzform textarea,section input[data-bzgca],section input[data-bzgoal],.zlbl input,.row input[id]{min-height:44px;border:0;border-radius:12px;background:var(--surface);padding:0 12px;color:var(--ink);font:inherit;width:100%}
.bzform textarea{padding:10px 12px}
a.say{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-weight:650;font-size:.8125rem;text-decoration:none}
/* ---------- Mosa · Projets ---------- */
.pjcard{margin-top:16px;padding:16px;border-radius:var(--r);background:var(--surface)}
.pjleft{display:flex;flex-direction:column;align-items:center;flex:none;padding:6px 12px;border-radius:14px;background:var(--gold-soft)}
.pjleft b{font:400 1.6rem/1 var(--serif);color:var(--gold)}.pjleft small{font-size:.625rem;color:var(--muted)}
.pjnext{margin-top:14px;padding:14px;border-radius:16px;background:var(--gold-soft)}

/* ---------- Mosa · Premium ---------- */
.btn{background:linear-gradient(135deg,#F8E9C4 0%,#E8C27A 42%,#C48F3A 100%);color:#1E1406;letter-spacing:.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,0,0,.14),0 12px 26px -16px rgba(232,194,122,.85);transition:transform .15s var(--ease),box-shadow .2s}
:root[data-mode="light"] .btn{background:linear-gradient(135deg,#EACB8E 0%,#C8973A 48%,#97691C 100%);color:#FFFFFF;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 12px 24px -16px rgba(151,105,28,.8)}
.btn:active{transform:scale(.97)}
.btn:disabled{filter:grayscale(.6);opacity:.55}
.btn.quiet{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 20%,transparent)}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 55%,transparent)}
.chip{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 26%,var(--line))}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,#F8E9C4,#E8C27A 50%,#C48F3A);color:#1E1406;box-shadow:0 6px 16px -10px rgba(232,194,122,.8)}
.seg{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 16%,transparent)}
.seg button[aria-pressed="true"]{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 40%,transparent),0 6px 16px -10px rgba(0,0,0,.4)}
.eyebrow{color:var(--gold);letter-spacing:.18em}
section>h2:first-child::after{content:"";display:block;width:28px;height:1.5px;margin-top:9px;border-radius:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.group,.tjfb,.pjcard,.bzout div,.mppick,.hcard,.dkstats div,.plancard,.sqcard,.zkcard{background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 94%,#FFFFFF 6%),var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 16%,transparent),0 16px 32px -26px rgba(0,0,0,.7)}
.bzsess,.pjcard{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 50%,transparent),0 22px 44px -30px rgba(232,194,122,.45)}
.pjnext{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 30%,transparent)}
.today-item{border-bottom-color:color-mix(in srgb,var(--gold) 14%,var(--line))}
.core{background:radial-gradient(circle at 35% 28%,#FFF4D6 0%,#E8C27A 42%,#B07F32 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 14px 30px -12px rgba(232,194,122,.7),0 0 0 6px color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.wheel .wb{-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%)}
input,textarea,select{caret-color:var(--gold)}
/* Récompenses : paillettes d'or */
.fx i{width:8px;height:8px;left:-4px;top:-4px;border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:linear-gradient(135deg,#FFF8E1 0%,#F3D9A4 35%,#E8C27A 60%,#A9782C 100%)}
.fx i:nth-child(3n){width:10px;height:10px;left:-5px;top:-5px;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);background:#FFF4D6}
.fx i:nth-child(4n){width:6px;height:6px;left:-3px;top:-3px;border-radius:50%;clip-path:none;background:radial-gradient(circle,#FFFFFF,#E8C27A 60%,rgba(232,194,122,0) 75%)}

/* ---------- Mosa · Code moto ---------- */
.cbar{height:6px;border-radius:3px;background:var(--raise);overflow:hidden;margin-top:14px}.cbar i{display:block;height:100%;background:linear-gradient(90deg,#E8C27A,#C48F3A);border-radius:3px}
.cbar.sm{display:block;height:3px;margin-top:6px;max-width:160px}
.cq{margin-top:16px;padding:18px 16px;border-radius:var(--r);background:color-mix(in srgb,var(--surface) 80%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 24%,transparent)}
.copt{display:flex;align-items:center;gap:12px;width:100%;margin-top:8px;padding:12px 14px;border-radius:14px;background:var(--raise);text-align:left;font-weight:550;min-height:52px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 14%,transparent)}
.copt b{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);font-size:.8125rem}
.copt.ok{box-shadow:inset 0 0 0 2px var(--mint);background:color-mix(in srgb,var(--mint) 14%,var(--raise))}.copt.ok b{background:var(--mint);color:#06231C}
.copt.ko{box-shadow:inset 0 0 0 2px var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--raise))}.copt.ko b{background:var(--danger);color:#fff}
.copt:disabled{opacity:1}
.cexp{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--gold-soft);line-height:1.5}
.cth .lbl{display:flex;flex-direction:column}
/* ---------- Mosa · décor thaïlandais et navigation ---------- */
#thai{position:fixed;inset:0;z-index:0;pointer-events:none;display:none}
body.ile-on #thai{display:block}
#thai canvas,#thai .thfx{position:absolute;inset:0;width:100%;height:100%}
body.ile-soft #thai::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 40%,transparent) 0%,color-mix(in srgb,var(--bg) 80%,transparent) 26%,color-mix(in srgb,var(--bg) 87%,transparent) 100%)}
:root[data-mode="light"] body.ile-soft #thai::after{background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 55%,transparent) 0%,color-mix(in srgb,var(--bg) 90%,transparent) 24%,color-mix(in srgb,var(--bg) 94%,transparent) 100%)}
.ilebg{display:none!important}
.thboat.far{animation:thfar 120s linear infinite}@keyframes thfar{0%{transform:translate(-60px,224px)}100%{transform:translate(440px,226px)}}
.thboat.near{animation:thnear 70s linear infinite;animation-delay:-28s}@keyframes thnear{0%{transform:translate(430px,690px)}100%{transform:translate(-140px,700px)}}
.thbirds{animation:thbirds 44s linear infinite}@keyframes thbirds{0%{transform:translate(-40px,120px)}100%{transform:translate(440px,90px)}}
.thg{opacity:0;animation:thg 3.4s ease-in-out infinite}@keyframes thg{40%{opacity:.9}80%{opacity:0}}
.thtail{transform-box:fill-box;transform-origin:0 0;animation:thtail 3s ease-in-out infinite alternate}@keyframes thtail{to{transform:rotate(14deg)}}
.thmk.b .thtail{animation-delay:-1.5s}
body.ile-on .core,body.ile-on .wheel,.core,.wheel{display:none!important}
.dock{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:flex;gap:2px;padding:6px;border-radius:24px;background:color-mix(in srgb,var(--surface) 62%,transparent);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 32%,transparent),0 18px 40px -18px rgba(0,0,0,.7)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:52px;padding:6px 4px;border-radius:18px;color:var(--ink-2);font-size:.6875rem;font-weight:600}
.dock button svg{width:22px;height:22px;color:currentColor}
.dock button.on{color:#1E1406;background:linear-gradient(135deg,#F8E9C4,#E8C27A 50%,#C48F3A);box-shadow:0 6px 16px -8px rgba(232,194,122,.8)}
:root[data-mode="light"] .dock button.on{color:#fff;background:linear-gradient(135deg,#EACB8E,#C8973A 50%,#97691C)}
.more{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:39;padding:16px;border-radius:24px;background:color-mix(in srgb,var(--surface) 72%,transparent);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 30%,transparent),0 24px 50px -20px rgba(0,0,0,.8);opacity:0;transform:translateY(16px) scale(.98);pointer-events:none;transition:opacity .25s var(--ease),transform .3s var(--ease)}
.more.open{opacity:1;transform:none;pointer-events:auto}
.moregrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.moregrid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:18px;background:color-mix(in srgb,var(--raise) 70%,transparent);font-size:.8125rem;font-weight:600;color:var(--ink)}
.moregrid i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#F8E9C4,#E8C27A 50%,#C48F3A);color:#1E1406}
.moregrid svg{width:22px;height:22px}
.moregrid button.on{box-shadow:inset 0 0 0 1.5px var(--gold)}
#app{padding-bottom:110px}
@media (prefers-reduced-motion: reduce){.thboat,.thbirds,.thg,.thtail{animation:none}.thboat.far{transform:translate(80px,224px)}.thboat.near{transform:translate(220px,695px)}.thbirds{transform:translate(120px,100px)}}

/* Ouverture réaliste : la baie apparaît depuis le noir, puis MOSA en lettres d'or */
.intro{background:transparent!important}
.intro::before{content:"";position:absolute;inset:0;background:#05090B;animation:mfade 1.6s cubic-bezier(.4,0,.2,1) .2s forwards}
@keyframes mfade{to{opacity:0}}
.intro::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 26%,rgba(255,214,150,.35),rgba(0,0,0,0) 55%),linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(3,12,14,.55));pointer-events:none}
.intro .intro-wrap{position:relative;z-index:1}
.intro .intro-wrap>svg{display:none}
body:has(#intro) #app,body:has(#intro) .dock,body:has(#intro) #thai .thfx{opacity:0}
#app,.dock{transition:opacity .6s var(--ease)}
.intro .it b{font-size:3.2rem;letter-spacing:.32em;background:linear-gradient(100deg,#B8863B 0%,#F8E9C4 40%,#E8C27A 55%,#B8863B 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:itxt 1s var(--ease) 1.1s forwards,mshine 2.4s ease 1.4s forwards}
@keyframes mshine{from{background-position:100% 0}to{background-position:0 0}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-wrap">
    <svg viewBox="-160 -160 320 320">
      <defs><linearGradient id="mSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B1E3F"/><stop offset=".55" stop-color="#C8664A"/><stop offset="1" stop-color="#F3B36B"/></linearGradient>
        <linearGradient id="mSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D6A73"/><stop offset="1" stop-color="#071A1F"/></linearGradient>
        <clipPath id="mClip"><circle r="150"/></clipPath><clipPath id="mSkyClip"><rect x="-160" y="-160" width="320" height="185"/></clipPath></defs>
      <g clip-path="url(#mClip)">
        <rect class="msky" x="-160" y="-160" width="320" height="190" fill="url(#mSky)"/>
        <g clip-path="url(#mSkyClip)"><circle class="msun" cx="0" cy="-20" r="34" fill="#FFD27A"/></g>
        <rect x="-160" y="25" width="320" height="140" fill="url(#mSea)"/>
        <g class="mrefl"><rect x="-26" y="32" width="52" height="3" rx="1.5" fill="#FFD27A" opacity=".7"/><rect x="-18" y="44" width="36" height="3" rx="1.5" fill="#FFD27A" opacity=".5"/><rect x="-11" y="56" width="22" height="3" rx="1.5" fill="#FFD27A" opacity=".35"/></g>
        <g class="mvil"><path d="M-110 25V33M-102 25V33M-94 25V33" stroke="#2A2018" stroke-width="2"/><rect x="-114" y="10" width="24" height="15" fill="#2A2018"/><path d="M-118 11L-102 0L-86 11Z" fill="#2A2018"/><rect x="-106" y="15" width="6" height="6" fill="#FFD27A"/>
          <path d="M92 25V33M100 25V33M108 25V33" stroke="#2A2018" stroke-width="2"/><rect x="88" y="10" width="24" height="15" fill="#2A2018"/><path d="M84 11L100 0L116 11Z" fill="#2A2018"/><rect x="96" y="15" width="6" height="6" fill="#FFD27A"/></g>
      </g>
      <circle r="150" fill="none" stroke="#E8C27A" stroke-opacity=".35"/>
    </svg>
    <div class="it"><b>MOSA</b><span lang="ar" dir="rtl">بِسْمِ ٱللَّهِ</span></div>
  </div>
</div>
<main id="app" tabindex="-1"></main>

<button class="core" id="core" type="button" aria-label="Modules" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" id="coreIc" aria-hidden="true"></svg></button>
<nav class="dock" id="dock" aria-label="Navigation"></nav><div class="more" id="more" aria-label="Tes modules"></div>
<div class="wheel" id="wheel" hidden><div class="wb"></div><p class="w-hint" id="wheelHint" aria-live="polite"></p><div id="wheelItems"></div></div>

<dialog class="sheet" id="shiftSheet" aria-labelledby="shiftSheetTitle"><div class="sheet-in" id="shiftSheetBody"></div></dialog>
<dialog class="sheet" id="settingsSheet" aria-labelledby="settingsTitle"><div class="sheet-in" id="settingsBody"></div></dialog>
<dialog class="sheet" id="ideasSheet" aria-labelledby="ideasTitle"><div class="sheet-in" id="ideasBody"></div></dialog>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"><span class="msg"></span><button type="button" hidden></button></div>

<script src="app.js"></script>
