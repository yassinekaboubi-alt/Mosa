<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mosa</title>
<meta name="description" content="Mosa : ta foi, ton business, ton corps et tes projets. Tout reste sur ton téléphone.">
<meta name="theme-color" content="#EEF2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08130F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mosa">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="serif-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Instrument Serif";src:url("serif-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url("serif-400i.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Amiri";src:url("amiri-400.woff2") format("woff2");font-weight:400;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:"Amiri";src:url("amiri-700.woff2") format("woff2");font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}

/* ---------- Palette « Émeraude & or » ---------- */
:root{
  --bg:#EEF2EE; --bg-2:#E4EBE6; --surface:#FFFFFF; --raise:#E3EAE5; --ink:#0B1F19; --ink-2:#2E4A40; --muted:#5B7369; --line:#D0DBD4; --orbit:#B9C9BF;
  --gold:#94700F; --gold-hi:#B8901F; --gold-ink:#FFFFFF; --gold-soft:#F3EAD2; --glow:rgba(184,144,31,.18);
  --mint:#187F5B; --mint-soft:#DDF0E7; --seg-bg:#E3EAE5; --seg-on:#FFFFFF;
  --danger:#B3372A; --danger-soft:#F7E3DF; --warn:#9A5600; --warn-soft:#F6E9D6;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,"Amiri",sans-serif;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --ar:"Amiri","Geeza Pro","Traditional Arabic","Noto Naskh Arabic",serif;
  --r:18px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.4,.5,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#08130F; --bg-2:#0C1C17; --surface:#0F221C; --raise:#163029; --ink:#EEF3EF; --ink-2:#C3D3CB; --muted:#86A197; --line:#1D3A31; --orbit:#27473D;
    --gold:#E9C46A; --gold-hi:#F5D98E; --gold-ink:#1A1405; --gold-soft:#2A2615; --glow:rgba(233,196,106,.22);
    --mint:#5ED3A8; --mint-soft:#123328; --seg-bg:#0F221C; --seg-on:#23463C;
    --danger:#FF8A7A; --danger-soft:#3A1A16; --warn:#F4A259; --warn-soft:#33240F;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:10px}
svg text{font-family:var(--sans)}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-weight:400}

main{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 10px) 20px calc(var(--sab) + 124px)}
.view > *{animation:rise .5s var(--ease) both}
.view > *:nth-child(2){animation-delay:.04s}.view > *:nth-child(3){animation-delay:.08s}.view > *:nth-child(4){animation-delay:.12s}.view > *:nth-child(5){animation-delay:.16s}.view > *:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* ---------- En-tête ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:10px}
.top h1{font:400 2.75rem/1 var(--serif);letter-spacing:-.01em;margin:0}
.top h1 em{color:var(--gold)}
.top p{margin:8px 0 0;color:var(--muted);font-size:.9375rem;max-width:26em}
.top-actions{display:flex;gap:2px;margin-right:-10px;flex:none}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--ink-2);transition:background .2s,transform .15s var(--ease)}
.icon-btn:active{background:var(--raise);transform:scale(.92)}
.icon-btn svg{width:22px;height:22px}

section{margin-top:44px}
h2{font:400 1.75rem/1.1 var(--serif);margin:0 0 16px;letter-spacing:-.005em}
h3{font:600 1rem/1.3 var(--sans);margin:0}
.eyebrow{font-size:.6875rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.muted{color:var(--muted)} .small{font-size:.875rem}
.hint{font-size:.8125rem;color:var(--muted);margin:10px 2px 0;line-height:1.45}
p{margin:0}
.row{display:flex;gap:10px;align-items:center} .row.between{justify-content:space-between} .grow{flex:1;min-width:0}

/* ---------- Aide (« à quoi ça sert ») ---------- */
.coach{margin-top:18px;padding:14px 16px 12px;border-radius:var(--r);background:var(--gold-soft);color:var(--ink);font-size:.9375rem;line-height:1.5}
.coach ol{margin:8px 0 0;padding-left:1.2em}
.coach li{margin:2px 0}
.coach button{margin-top:8px;min-height:40px;color:var(--gold);font-weight:700;padding:0}

/* ---------- Boutons ---------- */
.btn{min-height:52px;padding:0 22px;border-radius:16px;background:var(--gold);color:var(--gold-ink);font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),background .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.block{width:100%}
.btn.quiet{background:var(--raise);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{min-height:44px;padding:0 16px;font-size:.9375rem;border-radius:14px}
.btn:disabled{opacity:.4}

/* ---------- Listes & champs ---------- */
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 16px;position:relative}
.cell + .cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.cell label,.cell .lbl{flex:1;min-width:0}
.cell input[type=time],.cell input[type=date],.cell input[type=month],.cell input[type=number],.cell input[type=text],.cell input.r{border:0;background:transparent;text-align:right;min-height:44px;font-variant-numeric:tabular-nums;color:var(--ink);max-width:55%;min-width:0}
.cell input.full{text-align:left;max-width:none;width:100%}
.cell input:focus{outline:none}
.cell:focus-within{background:var(--gold-soft)}
.cell .unit{color:var(--muted);font-size:.875rem;flex:none}
.cell input.r{width:5.5em;flex:none;max-width:40%}
.cell.tap{width:100%;text-align:left}
.cell.tap:active{background:var(--raise)}
.chev{color:var(--muted);flex:none}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--seg-bg);border-radius:16px;padding:4px;gap:4px;position:relative}
.seg button{min-height:44px;border-radius:12px;font-weight:650;font-size:.9375rem;color:var(--muted);transition:background .25s var(--ease),color .25s,transform .15s var(--ease);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.08)}
.seg .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.35}
.seg button[aria-pressed="true"] .dot{background:var(--gold);opacity:1}

.stepper{display:flex;align-items:center}
.stepper button{width:44px;height:44px;border-radius:12px;font-size:1.35rem;color:var(--gold);display:grid;place-items:center;transition:transform .15s var(--spring)}
.stepper button:active{background:var(--raise);transform:scale(.9)}
.stepper output{min-width:66px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}

.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .25s var(--ease)}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.switch input:checked + span{background:var(--gold)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:2.5px solid var(--gold);outline-offset:2px}

.check{display:flex;gap:14px;align-items:flex-start;padding:13px 0;cursor:pointer;min-height:48px;position:relative}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.75px var(--orbit);display:grid;place-items:center;transition:background .2s var(--ease),box-shadow .2s}
.box svg{width:14px;height:14px;stroke:var(--gold-ink);stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s var(--ease) .05s}
.check input:checked + .box{background:var(--gold);box-shadow:0 0 0 5px var(--glow);animation:pop .45s var(--spring)}
.check input:checked + .box svg{stroke-dashoffset:0}
.check input:focus-visible + .box{outline:2.5px solid var(--gold);outline-offset:3px}
.check .txt{flex:1;transition:color .25s;padding-top:2px}
.check input:checked ~ .txt{color:var(--muted)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}}
.checks .check + .check{border-top:1px solid var(--line)}

textarea{width:100%;min-height:110px;border:0;border-radius:var(--r);background:var(--surface);padding:14px 16px;resize:vertical;line-height:1.5}
textarea:focus{outline:2px solid var(--gold)}

.bar{height:6px;border-radius:99px;background:var(--raise);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .7s var(--ease)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:650;padding:3px 9px;border-radius:99px;background:var(--raise);color:var(--ink-2);white-space:nowrap}
.pill.gold{background:var(--gold-soft);color:var(--gold)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)} .pill.mint{background:var(--mint-soft);color:var(--mint)}
.empty{padding:26px 0;color:var(--muted);text-align:center;font-size:.9375rem}

/* ---------- Orbite (accueil) ---------- */
.orbit-stage{position:relative;margin:6px -20px 0;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.orbit-stage > svg{display:block;width:100%;height:auto;max-height:430px;overflow:visible}
.orbit-ring{fill:none;stroke:var(--orbit);stroke-width:1}
.sun-core{fill:var(--gold-hi)}
.planet{cursor:pointer}
.planet .body{fill:var(--surface);stroke:var(--orbit);stroke-width:1}
.planet .trk{fill:none;stroke:var(--raise);stroke-width:3.5}
.planet .prog{fill:none;stroke:var(--gold);stroke-width:3.5;stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.planet.mint .prog{stroke:var(--mint)}
.planet .ic{color:var(--ink-2)}
.planet .lbl{font-size:12px;font-weight:650;fill:var(--ink-2);text-anchor:middle}
.planet .val{font-size:10.5px;fill:var(--muted);text-anchor:middle;font-variant-numeric:tabular-nums}
.planet.locked .body{fill:var(--bg-2);stroke-dasharray:3 3}
.planet.locked .ic{color:var(--muted)}
.planet:focus{outline:none}
.planet:focus-visible .body{stroke:var(--gold);stroke-width:2.5}
.today-list{display:grid}
.today-item{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);min-height:64px;transition:transform .15s var(--ease)}
.today-item:first-child{border-top:1px solid var(--line)}
.today-item:active{transform:scale(.985)}
.mini-orb{width:40px;height:40px}
.today-item b{font-weight:600;display:block}
.today-item span.s{font-size:.8125rem;color:var(--muted)}
.greet{font:400 1.0625rem var(--serif);font-style:italic;color:var(--gold);margin:0}

/* ---------- Parcours : l'année en orbite ---------- */
.dial-wrap{position:relative;margin:10px -8px 0;touch-action:pan-y}
.dial-wrap > svg{display:block;width:100%;height:auto;max-height:400px;overflow:visible}
.moon{cursor:pointer}
.moon .mb{fill:var(--surface);stroke:var(--orbit);stroke-width:1;transition:r .35s var(--spring)}
.moon .mt{fill:none;stroke:var(--raise);stroke-width:3}
.moon .mp{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
.moon .mn{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.moon.sel .mb{fill:var(--gold);stroke:var(--gold)}
.moon.sel .mn{fill:var(--gold-ink)}
.moon.sel .mt{stroke:transparent}
.moon.now .halo{fill:none;stroke:var(--mint);stroke-width:1.5;stroke-dasharray:2 3}
.moon:focus{outline:none}
.moon:focus-visible .mb{stroke:var(--gold);stroke-width:3}
.qlabel{font-size:10px;font-weight:700;letter-spacing:.14em;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.dial-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48%;text-align:center;pointer-events:none}
.dial-center .big{font:400 3.5rem/1 var(--serif);letter-spacing:-.02em}
.dial-center .t{font-size:.8125rem;line-height:1.3;color:var(--ink-2);margin-top:4px;text-wrap:balance}
.dial-nav{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.month-card{margin-top:22px}
.month-card .why{font:400 1.375rem/1.3 var(--serif);font-style:italic;color:var(--ink-2);margin-top:10px}
.steps{margin-top:24px;display:grid}
.step{display:grid;grid-template-columns:34px 1fr;gap:14px;padding-bottom:26px;position:relative}
.step::before{content:"";position:absolute;left:16.5px;top:38px;bottom:4px;width:1px;background:var(--line)}
.step:last-child::before{display:none}
.step .sn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.875rem;background:var(--raise);color:var(--ink-2);transition:background .3s,color .3s}
.step.ok .sn{background:var(--gold);color:var(--gold-ink)}
.step h3{padding-top:6px;display:flex;justify-content:space-between;gap:8px}
.step h3 span{font-weight:500;color:var(--muted);font-size:.875rem;font-variant-numeric:tabular-nums}
.res{list-style:none;padding:0;margin:8px 0 0}
.res li{padding:10px 0}
.res li + li{border-top:1px solid var(--line)}
.res li b{font-weight:600;display:block}
.res li span{font-size:.875rem;color:var(--muted)}
.exercise{margin-top:10px;padding:14px 16px;border-radius:var(--r);background:var(--surface);box-shadow:inset 3px 0 0 var(--gold)}
.stats-line{display:flex;gap:26px;margin-top:6px}
.stats-line div b{display:block;font:400 2rem/1.1 var(--serif)}
.stats-line div span{font-size:.75rem;color:var(--muted)}
.skills{display:grid;gap:14px}
.skill{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline;font-size:.9375rem}
.skill .bar{grid-column:1/-1}

/* ---------- Arabe ---------- */
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
.constel{margin:6px -10px 0;position:relative}
.constel > svg{display:block;width:100%;height:auto;max-height:280px}
.star{cursor:pointer;transition:r .3s var(--spring)}
.constel-tip{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);text-align:center;font-size:.875rem;color:var(--ink-2);min-height:1.5em;width:100%}
.quiz{position:relative;perspective:1200px}
.qcard{background:var(--surface);border-radius:24px;padding:26px 18px 18px;text-align:center;transition:transform .45s var(--ease),opacity .3s}
.qcard.out{transform:translateX(-30px) rotate(-2deg);opacity:0}
.qcard.in{animation:cardin .45s var(--ease)}
@keyframes cardin{from{transform:translateX(40px) rotate(2deg);opacity:0}}
.qcard .word{font-family:var(--ar);font-size:3.8rem;line-height:1.65;direction:rtl}
.qcard .root{font-size:.8125rem;color:var(--muted);min-height:1.6em}
.qcard .root .ar{font-size:1.25rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.opt{min-height:58px;padding:8px 10px;border-radius:16px;background:var(--raise);font-weight:550;line-height:1.25;transition:background .25s,color .25s,transform .18s var(--spring),opacity .25s}
.opt:active{transform:scale(.95)}
.opt.good{background:var(--mint);color:var(--surface);transform:scale(1.03)}
.opt.bad{background:var(--danger);color:var(--surface)}
.opt.dim{opacity:.35}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:.8125rem;color:var(--muted);min-height:44px}
.mastery{display:flex;gap:4px}
.mastery i{width:8px;height:8px;border-radius:50%;background:var(--raise);transition:background .3s,transform .3s var(--spring)}
.mastery i.on{background:var(--mint);transform:scale(1.2)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.verse{padding:14px 0;border-top:1px solid var(--line)}
.verse .vn{font-size:.75rem;color:var(--muted);font-weight:600}
.words{display:flex;flex-wrap:wrap;gap:4px 8px;direction:rtl;margin-top:4px}
.w{display:flex;flex-direction:column;align-items:center;min-width:48px;min-height:48px;padding:2px 6px;border-radius:12px;transition:background .2s,transform .15s var(--ease)}
.w:active{background:var(--raise);transform:scale(.95)}
.w .a{font-family:var(--ar);font-size:1.8rem;line-height:1.75}
.w .f{font-size:.75rem;color:var(--muted);direction:ltr;max-width:9em;text-align:center;line-height:1.25;transition:opacity .3s,filter .3s,color .3s}
.hide .w:not(.shown) .f{opacity:0;filter:blur(4px)}
.hide .w.shown .f{color:var(--gold)}
.hide .w:not(.shown) .a{text-shadow:0 0 18px var(--glow)}
.counter{display:flex;align-items:center;justify-content:space-between;gap:10px}
.counter .big{font:400 3.25rem/1 var(--serif)}
.counter .big small{font-size:1.25rem;color:var(--muted)}
.sour .check{align-items:center}
.sour .sn{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8125rem;width:28px}
.sour .ar{font-size:1.4rem;line-height:1.3}
.qtr{padding:4px 0}
.qtr.cur{background:var(--surface);border-radius:var(--r);padding:12px 16px 4px;margin:0 -4px}

/* ---------- Routine ---------- */
.ring-wrap{display:grid;place-items:center;margin-top:10px;position:relative}
.ring-wrap > svg{width:min(300px,86vw);height:auto;display:block;overflow:visible}
.seg-arc{fill:none;stroke:var(--raise);stroke-width:30;cursor:pointer;transition:stroke .35s var(--ease)}
.seg-arc.on{stroke:var(--gold)}
.seg-arc:focus{outline:none}
.seg-arc:focus-visible{stroke:var(--gold-hi)}
.seg-lbl{font-size:11px;font-weight:700;fill:var(--muted);text-anchor:middle;dominant-baseline:central;pointer-events:none;transition:fill .3s}
.seg-lbl.on{fill:var(--gold-ink)}
.ring-center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center}
.ring-center .big{font:400 3.75rem/1 var(--serif)}
.ring-center p{font-size:.8125rem;color:var(--muted)}
.ring-wrap.complete svg{filter:drop-shadow(0 0 18px var(--glow))}
.blocks{display:grid;margin-top:14px}
.blocks .block{display:grid;grid-template-columns:56px 1fr 28px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%;min-height:60px}
.blocks .block b{font-variant-numeric:tabular-nums;font-weight:700}
.blocks .block .dotc{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.75px var(--orbit);display:grid;place-items:center;transition:background .25s}
.blocks .block.on .dotc{background:var(--gold);box-shadow:none}
.blocks .block .dotc svg{width:13px;height:13px;stroke:var(--gold-ink);stroke-width:3;fill:none;opacity:0;transition:opacity .2s}
.blocks .block.on .dotc svg{opacity:1}
.blocks .block.on h3{color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal .dh{text-align:center;font-size:.6875rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.day{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:.8125rem;font-variant-numeric:tabular-nums;color:var(--muted);min-height:40px;position:relative;transition:transform .15s var(--spring)}
.day:active{transform:scale(.9)}
.day i{position:absolute;inset:3px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),transparent 0);opacity:.35}
.day.on i{opacity:1}
.day span{position:relative}
.day.on span{color:var(--gold-ink);font-weight:700}
.day.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.day:disabled{opacity:.3;cursor:default}

/* ---------- Heures ---------- */
.pocket{margin-top:22px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.pocket > svg{width:136px;height:136px;display:block}
.pocket .big{font:400 2.75rem/1 var(--serif);letter-spacing:-.01em;color:var(--gold)}
.pocket .lines{display:grid;gap:6px;margin-top:10px;font-size:.8125rem;color:var(--muted)}
.pocket .lines b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.legend{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tdial{display:grid;place-items:center;margin-top:16px;position:relative}
.tdial > svg{width:min(310px,86vw);height:auto;display:block;overflow:visible;touch-action:pan-y}
.tdial .trk{fill:none;stroke:var(--raise);stroke-width:30}
.tdial .night{fill:none;stroke:var(--line);stroke-width:30}
.tdial .shift-arc{fill:none;stroke:var(--gold);stroke-width:30;stroke-linecap:round;opacity:.9}
.tdial .tick{stroke:var(--orbit);stroke-width:1}
.tdial .hl{font-size:11px;fill:var(--muted);text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.tdial .handle{cursor:grab;touch-action:none}
.tdial .handle .hit{fill:transparent}
.tdial .handle .hb{fill:var(--surface);stroke:var(--gold);stroke-width:3;transition:r .2s var(--spring)}
.tdial .handle.start .hb{fill:var(--gold)}
.tdial .handle.drag .hb{r:20}
.tdial .handle:focus{outline:none}
.tdial .handle:focus-visible .hb{stroke:var(--ink);stroke-width:3}
.tdial .moonlbl{font-size:10px;fill:var(--muted);font-weight:700;letter-spacing:.1em;text-anchor:middle;dominant-baseline:central}
.tdial-center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center}
.tdial-center .big{font:400 3.25rem/1 var(--serif)}
.tdial-center p{font-size:.8125rem;color:var(--muted);margin-top:4px}
.time-chips{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:14px}
.time-chip{min-width:0;background:var(--surface);border-radius:16px;padding:8px 14px;display:flex;flex-direction:column}
.time-chip span{font-size:.6875rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.time-chip input{border:0;background:transparent;font-size:1.375rem;font-weight:600;font-variant-numeric:tabular-nums;padding:0;min-height:36px;width:100%;color:var(--ink)}
.time-chip input:focus{outline:none}
.time-chip:focus-within{box-shadow:inset 0 0 0 2px var(--gold)}
.form-actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}
.flash{animation:flash 1s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--gold)}100%{box-shadow:0 0 0 4px transparent}}
.alert{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:.9rem}
.alert.danger{background:var(--danger-soft);color:var(--danger)}
.alert svg{flex:none;width:20px;height:20px;margin-top:1px}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-nav h2{margin:0;text-transform:capitalize}
.emp-block{padding:18px 0;border-top:1px solid var(--line)}
.emp-block .head{display:flex;justify-content:space-between;align-items:baseline}
.emp-block .head b{font:400 2rem/1 var(--serif);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.kv div{font-size:.75rem;color:var(--muted)}
.kv div b{display:block;font-size:.9375rem;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface)}
.money div{font-size:.75rem;color:var(--muted)}
.money div b{display:block;font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:650}
.money div.hi b{color:var(--gold)}
.payslip{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.payslip label{font-size:.875rem;color:var(--ink-2)}
.payslip input{width:100px;min-height:44px;border:0;border-radius:12px;background:var(--surface);padding:0 12px;text-align:right;font-variant-numeric:tabular-nums}
.payslip input:focus{outline:2px solid var(--gold)}
.weeks .wk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.weeks .wk small{grid-column:1/-1;color:var(--muted);font-size:.8125rem}
.shift{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line);min-height:62px;transition:background .2s}
.shift:active{background:var(--raise)}
.shift .d{text-align:center;line-height:1.1}
.shift .d b{display:block;font:400 1.625rem/1 var(--serif)}
.shift .d span{font-size:.625rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.shift .who{font-weight:600;display:flex;align-items:center;gap:6px}
.shift .when{font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums;display:block}
.shift .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.shift .dur{font-weight:650;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 15px;border-radius:99px;background:var(--raise);font-size:.875rem;font-weight:650;color:var(--ink-2);transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.nudge{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:24px;padding:12px 14px;border-radius:14px;background:var(--surface);font-size:.875rem}
.edot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.edot.gare{background:var(--gold)} .edot.pizza{background:var(--mint)}


/* ---------- Budget ---------- */
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:16px;padding:10px 0 6px;border-bottom:1.5px solid var(--line)}
.amount:focus-within{border-color:var(--gold)}
.amount input{border:0;background:transparent;font:400 3.5rem/1.1 var(--serif);text-align:right;width:6ch;min-width:0;color:var(--ink);padding:0}
.amount input::placeholder{color:var(--orbit)}
.amount input:focus{outline:none}
.amount span{font:400 2rem var(--serif);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips .chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.flow{border-top:1px solid var(--line)}
.flow details{border-bottom:1px solid var(--line)}
.flow summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:54px;cursor:pointer;gap:10px}
.flow summary::-webkit-details-marker{display:none}
.flow summary span::after{content:"›";display:inline-block;margin-left:8px;color:var(--muted);transition:transform .25s var(--ease)}
.flow details[open] summary span::after{transform:rotate(90deg)}
.flow-in{padding:0 0 12px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line)}
.flow-in .frow{border-bottom:0;min-height:44px}
.frow .check{flex:1}
.frow.total{font-weight:650}
.frow.total b{font:400 1.5rem var(--serif)}
.famt{width:96px;min-height:40px;border:0;border-radius:10px;background:var(--surface);padding:0 10px;text-align:right;font-weight:600}
.famt:focus{outline:2px solid var(--gold)}
.envs{display:grid;gap:18px}
.env .bar{margin-top:8px}
.pots{display:grid}
.pot{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.pot-ring{width:48px;height:48px;flex:none}
.insights{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.insights li{padding:12px 14px;border-radius:14px;background:var(--surface);font-size:.9375rem;line-height:1.45}
.insights b{color:var(--gold);font-weight:650}
.srow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.srow input,.srow select{min-width:0;min-height:44px;border:0;border-radius:12px;background:var(--surface);padding:0 10px;color:var(--ink)}
.srow input:focus,.srow select:focus{outline:2px solid var(--gold)}
.srow .icon-btn{flex:none;width:40px}

/* ---------- Fondations, foi, business ---------- */
.cond{padding:0 0 18px}
.cond h3{display:flex;align-items:center;gap:8px}
.cond .bar{margin-top:8px}
.cond-ok{width:20px;height:20px;border-radius:50%;background:var(--mint);display:inline-grid;place-items:center}
.cond-ok svg{width:11px;height:11px;stroke:var(--surface);stroke-width:3;fill:none}
.locked-card{padding:16px 18px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2)}
.locked-card b,.locked-hero b.num{display:block;font:400 1.75rem/1.1 var(--serif);color:var(--ink)}
.locked-card .row span,.locked-hero .row span{font-size:.75rem;color:var(--muted)}
.locked-hero{margin-top:22px;padding:24px 20px;border-radius:24px;background:var(--surface);text-align:center;color:var(--ink-2)}
.lock-big{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--gold-soft);color:var(--gold);margin-bottom:12px}
.inv-type{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:var(--gold-soft);color:var(--gold)}
.bar.goal{position:relative;overflow:visible}
.bar.goal i{border-radius:99px}
.bar.goal span{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px;transform:translateX(-1px)}
.sunpath{position:relative;width:100%;max-width:380px;margin:4px auto 0;aspect-ratio:360/250}
.sunpath svg{display:block;width:100%;height:100%;overflow:visible}
.prayer{position:absolute;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--orbit);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:background .3s var(--ease),box-shadow .3s,transform .2s var(--spring)}
.prayer .ar{font-size:1.05rem;line-height:1.3}
.prayer small{font-size:.625rem;font-weight:700;letter-spacing:.04em;color:var(--muted);margin-top:1px}
.prayer.on{background:var(--gold);box-shadow:0 0 0 6px var(--glow);color:var(--gold-ink)}
.prayer.on small{color:var(--gold-ink);opacity:.75}
.prayer:active{transform:translate(-50%,-50%) scale(.92)}
.cal10{grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.cal10 .day{min-height:0;font-size:.6875rem}
.proj{padding:16px 0;border-top:1px solid var(--line)}
.proj input{width:100%;border:0;background:transparent;color:var(--ink);padding:0;min-height:40px}
.proj input:focus{outline:none;box-shadow:inset 0 -1.5px 0 var(--gold)}
.proj-name{font:400 1.5rem var(--serif)}
.proj-next{font-size:.9375rem;color:var(--ink-2)!important;margin-top:6px}
.plan-card{padding:16px 18px;border-radius:var(--r);background:var(--gold-soft);margin-bottom:22px}
.plan-split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.plan-split span{display:block;font-size:.75rem;color:var(--muted)}
.plan-split b{font:400 2rem/1.1 var(--serif);color:var(--gold)}
.archive{display:grid}
.arow{display:grid;grid-template-columns:1.25fr 1fr 1fr .9fr;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%;min-height:60px}
.arow:active{background:var(--raise)}
.arow .am{font-weight:600;text-transform:capitalize;font-size:.9375rem}
.arow .ac{display:flex;flex-direction:column;line-height:1.25}
.arow .ac small{font-size:.6875rem;color:var(--muted)}
.arow .ac b{font-weight:600;font-size:.875rem}


/* ---------- Noyau & roue ---------- */
.core{position:fixed;left:50%;bottom:calc(var(--sab) + 16px);z-index:31;width:60px;height:60px;margin-left:-30px;border-radius:50%;display:grid;place-items:center;touch-action:none;-webkit-touch-callout:none;
  background:radial-gradient(circle at 34% 30%,var(--gold-hi),var(--gold) 62%);color:var(--gold-ink);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--bg) 75%,transparent),0 10px 28px rgba(0,0,0,.28),0 0 26px var(--glow);transition:transform .3s var(--spring)}
.core svg{width:26px;height:26px;position:relative}
.core::before{content:"";position:absolute;inset:-11px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--gold) 50%,transparent);animation:spin 40s linear infinite;pointer-events:none}
.core::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold-hi);top:-14.5px;left:26.5px;transform-origin:3.5px 44.5px;animation:spin 8s linear infinite;box-shadow:0 0 8px var(--gold);pointer-events:none}
.core:active{transform:scale(.9)}
.core[aria-expanded="true"]{transform:scale(1.08)}
.core:focus-visible{outline-offset:8px;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.wheel{position:fixed;inset:0;z-index:30;touch-action:none;-webkit-user-select:none;user-select:none}
.wheel .wb{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 100%,color-mix(in srgb,var(--bg) 70%,transparent),color-mix(in srgb,var(--bg) 92%,transparent));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:0;transition:opacity .25s var(--ease)}
.wheel.open .wb{opacity:1}
.w-hint{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 100px);margin:0;text-align:center;font:400 1.625rem/1 var(--serif);color:var(--gold);opacity:0;transform:translateY(8px);transition:opacity .25s,transform .35s var(--spring);pointer-events:none}
.wheel.open .w-hint{opacity:1;transform:none}
.w-item{position:absolute;left:50%;bottom:calc(var(--sab) + 21px);width:50px;height:50px;margin-left:-25px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.5px var(--orbit),0 8px 20px rgba(0,0,0,.2);transform:scale(.2);opacity:0;
  transition:transform .5s var(--spring),opacity .22s,background .2s,box-shadow .2s,color .2s;transition-delay:calc(var(--i) * 28ms)}
.wheel.open .w-item{transform:translate(var(--x),var(--y));opacity:1}
.w-item svg{width:22px;height:22px}
.w-lbl{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:.6875rem;font-weight:700;white-space:nowrap;color:var(--ink-2);pointer-events:none}
.w-item.cur{box-shadow:inset 0 0 0 2px var(--gold),0 8px 20px rgba(0,0,0,.2)}
.w-item.cur .w-lbl{color:var(--gold)}
.w-item.locked{background:var(--bg-2);color:var(--muted)}
.wheel.open .w-item.hi{background:var(--gold);color:var(--gold-ink);transform:translate(var(--x),var(--y)) scale(1.2);box-shadow:0 0 0 8px var(--glow);transition-delay:0s}
.wheel.open .w-item:active{transform:translate(var(--x),var(--y)) scale(.92)}

/* ---------- Corps ---------- */
.seg3 button{font-size:.875rem}
.hadith{margin:18px 0 0;padding:14px 16px 12px;border-radius:var(--r);background:var(--surface);text-align:center}
.hadith .ar{font:400 1.25rem/1.9 var(--ar);margin:0;color:var(--ink)}
.hadith figcaption{font-size:.8125rem;color:var(--muted);line-height:1.45;margin-top:2px}
.ptrack{margin-top:24px}
.ptrack > svg{width:100%;height:auto;display:block;overflow:visible}
.pnode{cursor:pointer}
.pnode:focus{outline:none}
.pnode:focus-visible .pb{stroke:var(--gold-hi);stroke-width:3.5}
.phase-card{margin-top:10px;padding:18px;border-radius:var(--r);background:var(--surface)}
.phase-card > h3{font:400 2rem/1.1 var(--serif);margin:4px 0 8px}
.phase-card .cond{padding:10px 0 4px}
.gymrow{padding:8px 0;margin-top:4px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:16px}
.wk span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.6875rem;font-weight:700;color:var(--muted)}
.wk i{width:36px;height:36px;max-width:100%;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--orbit);display:grid;place-items:center;position:relative}
.wk i svg{width:15px;height:15px;stroke:var(--gold-ink);stroke-width:3;fill:none}
.wk .on i{background:var(--gold);box-shadow:0 0 0 5px var(--glow)}
.wk .today{color:var(--gold)}
.wk .today i{box-shadow:inset 0 0 0 2px var(--gold)}
.wk .on.today i{box-shadow:0 0 0 5px var(--glow)}
.wk .fast i::after,.fdot{content:"";width:6px;height:6px;border-radius:50%;background:var(--mint);display:inline-block}
.wk .fast i::after{position:absolute;bottom:-2px;right:-2px;box-shadow:0 0 0 2px var(--bg)}
.next-card{margin-top:20px;padding:20px 18px;border-radius:24px;background:linear-gradient(165deg,var(--gold-soft),var(--surface) 70%)}
.next-card h3{font:400 2.5rem/1 var(--serif);margin:6px 0 6px}
.ex-prev{list-style:none;padding:0;margin:14px 0 18px}
.ex-prev li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.9375rem}
.ex-prev b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.prog-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:.9375rem}
.prog-row b{font-weight:600;white-space:nowrap}
.warm{margin-top:18px;padding:12px 16px;border-radius:14px;background:var(--surface);font-size:.9375rem}
.warm summary{font-weight:650;cursor:pointer;min-height:28px;display:flex;align-items:center}
.warm p{margin:6px 0 2px;color:var(--ink-2)}
.ex-card{margin-top:14px;padding:16px;border-radius:var(--r);background:var(--surface);transition:box-shadow .3s}
.ex-card.complete{box-shadow:inset 0 0 0 1.5px var(--gold)}
.ex-name{font:400 1.5rem/1.15 var(--serif);margin:3px 0 6px}
.sugg{margin:10px 0 2px;padding:9px 12px;border-radius:12px;background:var(--raise);font-size:.875rem;color:var(--ink-2);line-height:1.45}
.sugg.up{background:var(--gold-soft);color:var(--ink)}
.set-row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 50px;gap:8px;align-items:center;margin-top:8px}
.set-row.bw{grid-template-columns:28px minmax(0,1fr) 50px}
.set-n{width:28px;height:28px;border-radius:50%;background:var(--raise);display:grid;place-items:center;font-size:.8125rem;font-weight:700;color:var(--muted)}
.set-f{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:12px;padding:0 10px;min-height:48px;min-width:0}
.set-f input{width:100%;min-width:0;border:0;background:transparent;font:400 1.4rem var(--serif);color:var(--ink);padding:0;min-height:46px;font-variant-numeric:tabular-nums}
.set-f input::placeholder{color:var(--muted);opacity:.55}
.set-f input:focus{outline:none}
.set-f span{font-size:.75rem;color:var(--muted);flex:none}
.set-f:focus-within{box-shadow:inset 0 0 0 1.5px var(--gold)}
.set-ok{width:50px;height:48px;border-radius:14px;background:var(--raise);display:grid;place-items:center;transition:background .2s,transform .2s var(--spring),box-shadow .2s}
.set-ok svg{width:20px;height:20px;stroke:var(--muted);stroke-width:2.6;fill:none}
.set-ok[aria-pressed="true"]{background:var(--gold);box-shadow:0 0 0 5px var(--glow)}
.set-ok[aria-pressed="true"] svg{stroke:var(--gold-ink)}
.set-ok:active{transform:scale(.88)}
.set-row.done .set-n{background:var(--gold-soft);color:var(--gold)}
.set-row.done input{color:var(--muted)}
.lvl{display:flex;gap:4px;flex:none}
.lvl button{width:40px;height:40px;border-radius:12px;background:var(--raise);font-size:1.25rem;color:var(--ink-2)}
.lvl button:disabled{opacity:.3}
.rest{position:fixed;left:50%;top:calc(var(--sat) + 10px);transform:translate(-50%,calc(-100% - var(--sat) - 20px));z-index:35;display:flex;align-items:center;gap:6px;padding:5px 6px 5px 6px;border-radius:99px;background:#0E2620;color:#EEF3EF;border:1px solid rgba(233,196,106,.25);white-space:nowrap;box-shadow:0 12px 34px rgba(0,0,0,.32);transition:transform .45s var(--spring),background .3s}
.rest.on{transform:translate(-50%,0)}
.rest > svg{width:42px;height:42px;flex:none}
.rest .trk{fill:none;stroke:rgba(238,243,239,.18);stroke-width:4}
.rest .prg{fill:none;stroke:#E9C46A;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.rest .rl{display:flex;flex-direction:column;line-height:1;min-width:3.4em;padding-right:4px}
.rest small{font-size:.625rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.rest b{font:400 1.6rem/1.05 var(--serif);font-variant-numeric:tabular-nums}
.rest button{min-height:42px;padding:0 12px;border-radius:99px;font-weight:700;font-size:.875rem;color:#F5D98E}
.rest.end{background:#E9C46A;color:#1A1405}
.rest.end button{color:#1A1405}
.rest.end .prg{stroke:#1A1405}
.fuel{position:relative;display:grid;place-items:center;margin-top:20px}
.fuel > svg{width:min(270px,74vw);height:auto;overflow:visible;display:block}
.fuel-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;line-height:1.35}
.fuel-c b{display:block;font:400 4rem/1 var(--serif)}
.fuel-c span{font-size:.8125rem;color:var(--muted)}
.foods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:20px}
.food{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:8px 12px;border-radius:14px;background:var(--surface);text-align:left;font-size:.875rem;line-height:1.25;transition:transform .15s var(--spring),background .2s}
.food b{flex:none;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.food:active{transform:scale(.94);background:var(--gold-soft)}
.flog{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.flog button{min-height:34px;padding:0 12px;border-radius:99px;background:var(--gold-soft);color:var(--ink-2);font-size:.8125rem;font-weight:600}
.flog button span{color:var(--muted);margin-left:2px}
.drops{display:flex;flex-wrap:wrap;gap:2px;margin-top:14px}
.drop{width:34px;height:46px;display:grid;place-items:center;transition:transform .2s var(--spring)}
.drop:active{transform:scale(.85)}
.drop svg{width:24px;height:28px}
.drop path{fill:var(--raise);stroke:var(--orbit);stroke-width:1.2;transition:fill .25s,stroke .25s}
.drop.on path{fill:var(--mint);stroke:var(--mint)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{padding:14px;border-radius:16px;background:var(--surface)}
.kpi b{display:block;font:400 1.75rem/1.1 var(--serif)}
.kpi span{font-size:.75rem;color:var(--muted);line-height:1.3;display:block;margin-top:2px}
.wchart{margin-top:4px}
.wchart > svg{width:100%;height:auto;display:block;overflow:visible}
.plate{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:center}
.plate > svg{width:112px;height:112px}
.plate-l{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:.875rem;line-height:1.35}
.plate-l li{display:flex;gap:8px;align-items:flex-start}
.plate-l i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:4px}
.plate-l b{font-weight:650}
.sbars{margin-top:10px}
.sbars > svg{width:100%;height:auto;display:block;overflow:visible}
.bed{padding:18px;border-radius:var(--r);background:var(--surface)}
.bed > b{display:block;font:400 3rem/1 var(--serif);color:var(--gold);margin-top:4px}
.fitra{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:16px}
.fit{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;font-weight:650;color:var(--ink-2);text-align:center;line-height:1.2}
.fit > svg{width:100%;max-width:72px;height:auto;overflow:visible;transition:transform .2s var(--spring)}
.fit small{font-weight:500;color:var(--muted);font-size:.6875rem}
.fit:active > svg{transform:scale(.9)}


/* ---------- Lumière ---------- */
.fx{position:fixed;z-index:45;width:0;height:0;pointer-events:none}
.fx i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#FFF4CF,#E9C46A 55%,rgba(233,196,106,0) 72%);transform:translate(0,0) scale(var(--s));opacity:0;animation:fxp .9s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes fxp{0%{opacity:1;transform:translate(0,0) scale(calc(var(--s)*1.4))}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
.fx-t{position:fixed;z-index:46;transform:translate(-50%,-50%);pointer-events:none;font:400 1.35rem/1 var(--serif);color:var(--gold);text-shadow:0 0 12px var(--glow);animation:fxt 1.25s var(--ease) forwards;white-space:nowrap}
.fx-t.big{font-size:2rem}
@keyframes fxt{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}18%{opacity:1;transform:translate(-50%,-80%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-240%) scale(1)}}
.gem{position:fixed;left:50%;top:calc(var(--sat) + 12px);z-index:44;width:min(92vw,420px);transform:translate(-50%,calc(-100% - var(--sat) - 30px));padding:14px 16px 12px;border-radius:20px;background:#0E2620;color:#EEF3EF;border:1px solid rgba(233,196,106,.35);box-shadow:0 18px 40px rgba(0,0,0,.35),0 0 30px rgba(233,196,106,.18);transition:transform .55s var(--spring)}
.gem.on{transform:translate(-50%,0)}
.gem-t{margin:0;font-size:.6875rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#E9C46A}
.gem-q{margin:6px 0 0;font:400 1.2rem/1.3 var(--serif)}
.gem-s{margin:4px 0 0;font-size:.75rem;color:#86A197}
.yday{margin-top:18px;padding:16px 18px;border-radius:var(--r);background:linear-gradient(160deg,var(--gold-soft),var(--surface) 75%)}
.yday-n{margin:2px 0 0;font:400 2.5rem/1 var(--serif);color:var(--gold)}
.yday.heavy{background:#0A1512;color:#AAB8B2;box-shadow:inset 0 0 0 1px #1A2A24}
.yday.heavy .yday-n{color:#55645E}
.yday.heavy .eyebrow,.yday.heavy .muted{color:#6E7F78}
.yday.heavy .link-btn{color:#AAB8B2}
.stake{margin-top:14px;padding:14px 16px;border-radius:var(--r);background:var(--warn-soft)}
.stake-i{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:44px;text-align:left;font-size:.9375rem;color:var(--ink);border-top:1px solid color-mix(in srgb,var(--warn) 20%,transparent)}
.stake-i:first-of-type{border-top:0}
.stake-i b{color:var(--warn);font-weight:700;white-space:nowrap}


/* ---------- Flux ---------- */
html.flux-on,html.flux-on body{overflow:hidden;background:#050A08}
html.flux-on main{padding:0;max-width:none}
.feed{position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:#050A08}
.feed::-webkit-scrollbar{display:none}
.fc{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;align-items:center;background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2) 70%);color:#EEF3EF}
.fcin{position:relative;z-index:2;width:100%;max-width:560px;margin:0 auto;padding:calc(var(--sat) + 76px) 64px calc(var(--sab) + 112px) 24px;max-height:100%;overflow-y:auto;scrollbar-width:none}
.fcin::-webkit-scrollbar{display:none}
.fl{position:absolute;inset:0;z-index:1;pointer-events:none}
.fl span{position:absolute;display:block;color:var(--ac);animation:fdrift 20s ease-in-out infinite alternate;will-change:transform}
.fl svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:.9;overflow:visible}
.fl .orb{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,var(--ac),transparent 65%);filter:blur(1px)}
@keyframes fdrift{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.fc:not(.in) .fl span{animation-play-state:paused}
.fk{margin:0 0 18px;font-size:.6875rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);opacity:0;transform:translateY(8px);transition:opacity .5s,transform .6s var(--ease)}
.fc.in .fk{opacity:.9;transform:none}
.fc .fw{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(4px)}
.fc.in .fw{animation:fword .7s var(--ease) both;animation-delay:calc(var(--i) * 45ms + .1s)}
@keyframes fword{to{opacity:1;transform:none;filter:none}}
.far{margin:0;font-family:var(--ar);font-weight:400;line-height:2.05;color:#F7F1DE;text-align:right}
.far.l{font-size:1.85rem}.far.m{font-size:1.5rem}.far.s{font-size:1.2rem}
.ffr{margin:18px 0 0;font:400 1.35rem/1.35 var(--serif);color:#EEF3EF}
.fq{margin:0;font:400 1.7rem/1.3 var(--serif);color:#F6EFDC}
.fpoem{margin:0;font-family:var(--ar);color:#F7F1DE;font-size:1.45rem;line-height:2}
.fpoem p{margin:0 0 14px;display:flex;flex-direction:column}
.fpoem p > span{display:block}
.fpoem p > span + span{padding-right:1.6em}
.fsrc{margin:14px 0 0;font-size:.8125rem;color:var(--ac);opacity:.85}
.ft{margin:0;font:400 2.1rem/1.12 var(--serif);color:#FFFFFF;letter-spacing:-.005em}
.ft.big{font-size:2.6rem}
.fb{margin:16px 0 0;font-size:1rem;line-height:1.55;color:#C9D6D0;opacity:0;transform:translateY(10px);transition:opacity .6s .45s,transform .7s var(--ease) .45s}
.fc.in .fb,.fans.on .fb{opacity:1;transform:none}
.fdo{margin-top:22px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border-left:3px solid var(--ac);font-size:.9375rem;line-height:1.45;color:#EEF3EF;opacity:0;transition:opacity .6s .8s}
.fc.in .fdo{opacity:1}
.fdo small{display:block;font-size:.625rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:3px}
.fexp{margin-top:20px;min-height:40px;padding:0 16px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--ac);font-weight:700;font-size:.875rem;border:1px solid rgba(255,255,255,.1)}
.fex{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.fex > p{overflow:hidden;margin:0;font-size:.9375rem;line-height:1.55;color:#C9D6D0}
.fex.on{grid-template-rows:1fr}
.fex.on > p{padding-top:14px}
.fnote{margin:18px 0 0;font-size:.6875rem;color:#7E8F88}
.fopts{display:grid;gap:10px;margin-top:26px}
.fvf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
.fopt{min-height:56px;padding:10px 16px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#EEF3EF;font-weight:650;font-size:1rem;text-align:left;transition:background .25s,transform .15s var(--spring),opacity .3s}
.fvf .fopt{text-align:center}
.fopt:active{transform:scale(.96)}
.fopt.good{background:var(--ac);color:#06110D;border-color:transparent}
.fopt.bad{background:rgba(255,120,100,.2);border-color:rgba(255,138,122,.6)}
.fopt.dim{opacity:.35}
.fans{margin-top:16px}
.fres{margin:0;font:400 1.5rem var(--serif);color:var(--ac)}
.farw{margin:0;text-align:center;font:400 4.5rem/1.6 var(--ar);color:#F7F1DE}
.fc .btn{background:var(--ac);color:#0A0905}
.fc .btn.fcont{background:rgba(255,255,255,.08);color:#EEF3EF}
.frail{position:absolute;z-index:3;right:10px;bottom:calc(var(--sab) + 120px);display:flex;flex-direction:column;gap:14px}
.frail button{width:48px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#EEF3EF;font-size:.625rem;font-weight:700;opacity:.85}
.frail button svg{width:26px;height:26px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.frail button[aria-pressed="true"]{color:var(--ac);opacity:1}
.frail button[aria-pressed="true"] svg{fill:currentColor}
.fhead{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--sat) + 10px) 12px 10px 20px;background:linear-gradient(to bottom,rgba(3,8,6,.55),transparent);color:#EEF3EF;pointer-events:none}
.fhead > *{pointer-events:auto}
.fhead .icon-btn{color:#EEF3EF}
.fh-t{margin:0;font:400 1.6rem/1 var(--serif)}
.fprog{display:flex;gap:3px;margin-top:6px}
.fprog i{width:10px;height:3px;border-radius:2px;background:rgba(255,255,255,.2);transition:background .3s}
.fprog i.on{background:#E9C46A}
.fhint{position:fixed;z-index:4;left:0;right:0;bottom:calc(var(--sab) + 96px);text-align:center;color:#EEF3EF;pointer-events:none;animation:fhint 2.4s ease-in-out infinite}
.fhint span{display:block;font-weight:700;font-size:.9375rem}
.fhint span::before{content:"";display:block;width:12px;height:12px;margin:0 auto 6px;border-left:2px solid;border-top:2px solid;transform:rotate(45deg)}
.fhint small{font-size:.75rem;opacity:.7}
@keyframes fhint{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-10px);opacity:1}}
html.flux-on .core{box-shadow:0 0 0 5px rgba(5,10,8,.6),0 10px 28px rgba(0,0,0,.4),0 0 26px rgba(233,196,106,.3)}

/* ---------- Animation d'entrée ---------- */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(90% 60% at 50% 45%,#0F2A21,#030806 70%);color:#E9C46A;animation:iout .6s var(--ease) 3.05s forwards;cursor:pointer}
.intro>.intro-wrap>svg{width:min(300px,76vw);height:auto;overflow:visible}
.intro .msun{animation:msun 2.4s cubic-bezier(.3,.6,.3,1) .1s both}
@keyframes msun{from{transform:translateY(-110px)}to{transform:translateY(0)}}
.intro .msky{animation:msky 2.4s ease .1s both}@keyframes msky{from{opacity:.4}to{opacity:1}}
.intro .mrefl,.intro .mvil{opacity:0}.intro .mrefl{animation:ifade 1s ease 1.4s both}.intro .mvil{animation:ifade 1s ease .9s both}
.intro .ir{fill:none;stroke:#27473D;stroke-width:1;stroke-dasharray:1100;stroke-dashoffset:1100;animation:idraw 1.3s var(--ease) forwards}
.intro .ir:nth-of-type(2){animation-delay:.12s}.intro .ir:nth-of-type(3){animation-delay:.24s}.intro .ir:nth-of-type(4){animation-delay:.36s}
.intro .isun{transform-origin:center;transform-box:fill-box;animation:isun .9s var(--spring) .1s both}
.intro .iglow{transform-origin:center;transform-box:fill-box;animation:iglow 2s ease-out .2s both}
.intro .ip{opacity:0;transform-origin:center;transform-box:fill-box;animation:ipl .6s var(--spring) both}
.intro .it{text-align:center;margin-top:10px}
.intro .it b{display:block;font:400 2.6rem/1 var(--serif);color:#EEF3EF;letter-spacing:.2em;opacity:0;animation:itxt 1s var(--ease) 1.65s forwards}
.intro .it span{display:block;margin-top:10px;font:400 1.3rem/1.5 var(--ar);color:#E9C46A;opacity:0;animation:ifade .8s ease 2.05s forwards}
.intro-wrap{display:flex;flex-direction:column;align-items:center}
@keyframes idraw{to{stroke-dashoffset:0}}
@keyframes isun{from{transform:scale(0)}}
@keyframes iglow{0%{opacity:0;transform:scale(.3)}40%{opacity:1}100%{opacity:.8;transform:scale(1)}}
@keyframes ipl{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes itxt{from{opacity:0;letter-spacing:.6em}to{opacity:1;letter-spacing:.2em}}
@keyframes ifade{to{opacity:1}}
@keyframes iout{to{opacity:0;transform:scale(1.08);visibility:hidden}}
.intro.skip{animation:iout .3s ease forwards}
@media (prefers-reduced-motion: reduce){.intro{display:none}}


/* ---------- Prières ---------- */
.prayer small{font-variant-numeric:tabular-nums}
.pbadge{position:absolute;right:-2px;top:-2px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--gold);box-shadow:0 0 0 2px var(--bg)}
.prayer.w-m{box-shadow:0 0 0 7px var(--glow),0 0 26px var(--gold)}
.prayer.w-g{box-shadow:0 0 0 6px var(--glow)}
.prayer.w-r{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.prayer.w-r small{color:var(--warn)}
.prayer.w-r .pbadge{color:var(--warn)}
.prayer.w-x{background:var(--danger-soft);color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.prayer.w-x small{color:var(--danger)}
.prayer.w-x .pbadge{color:var(--danger)}
.pnow{margin:14px 0 0;padding:10px 14px;border-radius:14px;background:var(--surface);font-size:.9375rem;text-align:center}
.pnow b{color:var(--gold)}
.pnow.hot{background:var(--warn-soft);color:var(--warn)}
.pnow.hot b{color:var(--warn)}
.ppick{position:absolute;z-index:6;width:min(236px,86%);padding:6px;border-radius:22px;background:var(--surface);box-shadow:0 14px 36px -14px rgba(0,0,0,.5),inset 0 0 0 .5px var(--line);opacity:0;transform:translateY(4px) scale(.96);transform-origin:var(--cx,50%) 100%;transition:opacity .18s,transform .32s var(--spring)}
.ppick.below{transform-origin:var(--cx,50%) 0}
.ppick.on{opacity:1;transform:none}
.ppick::after{content:"";position:absolute;left:var(--cx,50%);bottom:-4px;width:8px;height:8px;margin-left:-4px;background:inherit;transform:rotate(45deg);box-shadow:inset -.5px -.5px 0 var(--line);border-radius:0 0 2px 0}
.ppick.below::after{bottom:auto;top:-4px;box-shadow:inset .5px .5px 0 var(--line);border-radius:2px 0 0 0}
.ppick-o{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.ppick [data-pway]{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:54px;padding:9px 0 8px;border-radius:16px;background:transparent;color:var(--muted);font-size:.625rem;font-weight:500;letter-spacing:.02em;line-height:1;transition:background .2s,color .2s,transform .18s var(--spring)}
.ppick svg{width:18px;height:18px;flex:none;color:var(--ink-2)}
.ppick [data-pway]:active{background:var(--raise);transform:scale(.94)}
.ppick [data-pway][aria-pressed="true"],.ppick [data-pway][aria-pressed="true"] svg{color:var(--gold)}
.ppick .ppick-x{display:block;width:100%;min-height:0;margin:2px 0 0;padding:7px 0 5px;border-top:.5px solid var(--line);border-radius:0;color:var(--muted);font-size:.6875rem;font-weight:500;letter-spacing:.02em}
.pstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.pstats div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;border-radius:14px;background:var(--surface);text-align:center}
.pstats i{color:var(--gold)}
.pstats .w-r i{color:var(--warn)}
.pstats .w-x i{color:var(--danger)}
.pstats b{font:400 1.5rem/1 var(--serif)}
.pstats span{font-size:.625rem;color:var(--muted);line-height:1.2}
.missed{position:fixed;inset:0;z-index:42;background:#030806;color:#EEF3EF;overflow:auto;padding:calc(var(--sat) + 30px) 20px calc(var(--sab) + 40px);animation:zfadeM .7s ease both}
.missed.out{opacity:0;transition:opacity .3s}
@keyframes zfadeM{from{opacity:0}}
.missed .in{max-width:520px;margin:0 auto}
.missed h2{color:#EEF3EF;margin:6px 0 8px}
.mrow{margin-top:18px;padding:14px;border-radius:16px;background:#0C1612}
.mrow > p{margin:0 0 10px;color:#C9D6D0}
.mrow > p b{color:#EEF3EF}
.mch{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mch button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;background:#13201B;color:#C9D6D0;font-size:.625rem;font-weight:650;line-height:1.2}
.mch button[data-mway="m"],.mch button[data-mway="g"],.mch button[data-mway="s"]{color:#E9C46A}
.mch button[data-mway="r"]{color:#F4A259}
.mch button[data-mway="x"]{color:#FF8A7A}
.mch button:disabled{opacity:.3}
.mch button.on{opacity:1;background:#E9C46A;color:#1A1405}
.mch button[data-mway="x"].on{background:#5a1f18;color:#FFB4A8}
.missed .btn{background:#13201B;color:#EEF3EF}

/* ---------- Feuilles ---------- */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;border-radius:26px 26px 0 0;background:var(--bg);color:var(--ink);overflow:auto;overscroll-behavior:contain}
dialog.sheet::backdrop{background:rgba(3,10,8,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog.sheet[open]{animation:up .38s var(--ease)}
@keyframes up{from{transform:translateY(60px);opacity:.3}}
.sheet-in{padding:10px 20px calc(var(--sab) + 26px)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;min-height:44px}
.sheet-top h2{margin:0;font-size:1.625rem}
.link-btn{min-height:44px;padding:0 6px;color:var(--gold);font-weight:650;min-width:60px}
.gt{font-size:.6875rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin:28px 4px 8px}
.idea{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.idea p{flex:1;white-space:pre-wrap;word-break:break-word}
.idea time{display:block;font-size:.75rem;color:var(--muted);margin-top:2px}
.confirm{margin-top:14px;padding:14px;border-radius:14px;background:var(--surface)}

.toast{position:fixed;left:50%;width:max-content;bottom:calc(var(--sab) + 94px);transform:translate(-50%,24px) scale(.96);opacity:0;z-index:40;background:var(--ink);color:var(--bg);border-radius:16px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;font-size:.9375rem;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.28);transition:transform .35s var(--spring),opacity .25s;pointer-events:none}
.toast.on{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.toast button{min-height:40px;padding:0 12px;border-radius:10px;color:var(--gold-hi);font-weight:700}
@media (prefers-color-scheme: light){.toast button{color:#F5D98E}}
.toast .msg{padding:8px 0}

::view-transition-old(root),::view-transition-new(root){animation-duration:.28s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}


/* ---------- Dhikr ---------- */
.dkchips{display:flex;gap:8px;overflow-x:auto;margin:18px -20px 0;padding:2px 20px 6px;scrollbar-width:none}
.dkchips::-webkit-scrollbar{display:none}
.dkchips .chip{flex:none;white-space:nowrap}
.dkform{display:grid;gap:8px;margin-top:12px}
.dkform input{min-height:44px;border:0;border-radius:12px;background:var(--surface);padding:0 12px;color:var(--ink);font:inherit}
.dkf{text-align:center;margin-top:20px}
.dkf .ar{margin:0;font:400 2rem/1.6 var(--ar);color:var(--gold)}
.dktr{margin:2px 0 0;font:400 1.35rem var(--serif)}
.dktap{position:relative;display:grid;place-items:center;width:min(250px,68vw);aspect-ratio:1;margin:18px auto 0;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--raise),var(--surface));box-shadow:0 0 0 1px var(--line),0 18px 40px -18px rgba(0,0,0,.5);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.dktap svg{position:absolute;inset:0;width:100%;height:100%}
.dktap span{position:relative;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.dktap b{font:400 4.2rem/1 var(--serif);color:var(--ink)}
.dktap small{margin-top:6px;font-size:.75rem;font-weight:600;color:var(--muted)}
.dktap.hit{animation:dkhit .22s var(--ease)}
@keyframes dkhit{40%{transform:scale(.965);box-shadow:0 0 0 1px var(--line),0 0 0 10px var(--glow)}}
.dkstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.dkstats div{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:14px;background:var(--surface)}
.dkstats b{font:400 1.6rem/1.1 var(--serif)}.dkstats span{font-size:.6875rem;color:var(--muted);margin-top:2px}

/* ---------- Plan en trois parts ---------- */
.plan-split.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.plan-split.three small{display:block;font-size:.6875rem;color:var(--muted);margin-top:2px}
/* ---------- Cheveux ---------- */
.hadv{border-bottom:1px solid var(--line)}
.hadv summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.hadv summary::-webkit-details-marker{display:none}
.hadv summary::after{content:"+";font:400 1.4rem/1 var(--serif);color:var(--muted);transition:transform .25s var(--ease)}
.hadv[open] summary::after{transform:rotate(45deg)}
.hadv p{margin:0 0 14px;line-height:1.55;color:var(--ink-2)}

/* ---------- Foi · Cœur ---------- */
.hgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:18px}
.hcell{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px 9px;border-radius:14px;background:var(--surface);min-height:0}
.hcell .ar{font:400 1.05rem/1.5 var(--ar);color:var(--muted)}
.hcell b{font-size:.75rem;font-weight:650}
.hcell i{display:flex;gap:3px;margin-top:3px}.hcell em{width:6px;height:6px;border-radius:50%;background:var(--raise)}.hcell em.f{background:var(--gold)}
.hcell small{position:absolute;top:-6px;right:-2px;padding:1px 6px;border-radius:99px;background:var(--gold);color:var(--gold-ink);font-size:.5625rem;font-weight:700;letter-spacing:.04em}
.hcell.on{box-shadow:inset 0 0 0 1.5px var(--gold)}.hcell.on .ar{color:var(--gold)}
.hcell.lv3{background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
.hcard{margin-top:18px;padding:18px 16px 4px;border-radius:var(--r);background:var(--surface)}
.hbig{margin:0 0 8px;text-align:center;font:400 2.6rem/1.9 var(--ar);color:var(--gold)}
.hsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.hsteps div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.6875rem;font-weight:600;color:var(--muted)}
.hsteps i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--raise);font-size:.75rem}
.hsteps i svg{width:13px;height:13px;stroke:var(--gold-ink);stroke-width:3;fill:none}
.hsteps .ok i{background:var(--gold)}.hsteps .now i{box-shadow:inset 0 0 0 2px var(--gold);color:var(--gold)}.hsteps .now{color:var(--ink)}
.hq{margin:0 0 6px;padding:12px 14px;border-radius:14px;background:var(--gold-soft)}
.hq p{margin:0;font:400 1.08rem/1.45 var(--serif)}.hq cite{display:block;margin-top:6px;font-style:normal;font-size:.6875rem;font-weight:600;color:var(--muted)}
.hq.sm{margin:4px 0 12px}.hq.sm p{font-size:.98rem}
.hcard textarea{width:100%;border:0;border-radius:12px;background:var(--raise);color:var(--ink);padding:10px 12px;font:inherit}
.hcard .zlbl{display:block;margin:12px 0 6px;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.hadv summary{gap:6px}

/* ---------- Sadaqa & zakat ---------- */
.sqcard,.zkcard{padding:16px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.zkcard{margin-top:18px}.zkcard p{margin:0;line-height:1.5}
/* ---------- Duʿa ---------- */
.hcell small.t2{background:var(--mint);color:var(--surface)}
.dsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0 12px}
.dsteps div{display:flex;flex-direction:column;gap:5px;font-size:.6875rem;font-weight:600;color:var(--muted);text-align:center}
.dsteps i{height:5px;border-radius:3px;background:var(--raise)}
.dsteps .ok i{background:var(--gold)}.dsteps .now i{background:linear-gradient(90deg,var(--gold),var(--raise))}.dsteps .now{color:var(--ink)}
.dnow{padding:12px 14px;border-radius:14px;background:var(--gold-soft);margin-bottom:12px}
.dstart{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 8px;padding:2px 16px 4px;scrollbar-width:none}
.dstart::-webkit-scrollbar{display:none}.dstart .chip{flex:none;white-space:nowrap}
.djent{padding:12px 14px;border-radius:14px;background:var(--surface);margin-bottom:8px}
.djent p{margin:0;font:400 1.05rem/1.5 var(--serif);white-space:pre-wrap}
.djent time{display:block;margin-top:6px;font-size:.6875rem;color:var(--muted)}
/* ---------- Journal de test ---------- */
.tjcard{margin-top:18px;padding:16px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--gold)}
.tjcard .zlbl{display:block;margin:14px 0 6px;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.tjcard textarea{width:100%;border:0;border-radius:12px;background:var(--raise);color:var(--ink);padding:10px 12px;font:inherit}
.tjnote{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.tjnote button{aspect-ratio:1;min-height:0;padding:0;border-radius:10px;background:var(--raise);font-weight:600;font-size:.8125rem;color:var(--ink-2)}
.tjnote button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}

/* ---------- Mes retours ---------- */
.tjfb{margin-top:16px;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.tjfbb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tjfbb .chip{min-height:40px;justify-content:center}
/* ---------- Prononciation ---------- */
.say{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 6px;border-radius:99px;background:transparent;color:var(--gold);font-size:.75rem;font-weight:600;vertical-align:middle}
.say:active{background:var(--gold-soft)}
/* ---------- Nutrition sans viande & semaine ---------- */
.pcombo{display:grid;gap:6px}
.pcombo button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);text-align:left;font-size:.875rem;font-weight:550;min-height:0}
.pcombo b{color:var(--mint);flex:none}
.mpgrid{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.mpday{display:grid;grid-template-columns:52px repeat(3,minmax(0,1fr));gap:5px;align-items:stretch}
.mpday>p{margin:0;align-self:center;font-size:.75rem;font-weight:650;color:var(--muted);text-transform:capitalize}
.mpday.today>p{color:var(--gold)}
.mpslot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 8px;min-height:58px;border-radius:12px;background:var(--surface);text-align:left;font-size:.6875rem;line-height:1.25;box-shadow:inset 0 0 0 1px var(--line)}
.mpslot small{font-size:.5625rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mpslot span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.mpslot b{font-size:.625rem;color:var(--mint)}
.mpslot.full{background:var(--raise)}.mpslot.on{box-shadow:inset 0 0 0 2px var(--gold)}
.mppick{margin-top:14px;padding:14px;border-radius:var(--r);background:var(--surface)}
.mprec{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:11px 12px;margin-top:6px;border-radius:12px;background:var(--raise);text-align:left;font-weight:600;font-size:.875rem;min-height:0}
.mprec small{display:block;font-weight:500;font-size:.6875rem;color:var(--muted)}
.mprec b{color:var(--mint);flex:none}
.mpform{display:grid;gap:8px;margin-top:12px}
.mpform input,.mpform textarea{min-height:44px;border:0;border-radius:12px;background:var(--raise);padding:10px 12px;color:var(--ink);font:inherit}
.mpadv{margin:0 0 8px;padding:10px 12px;border-radius:12px;background:var(--surface);line-height:1.5}
.mppick .zlbl{display:block;margin:12px 0 2px;font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* ---------- Recettes ---------- */
.mprecipe{margin-top:14px;padding:16px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--gold)}
.mprecipe .zlbl,.mptoday .eyebrow{display:block;margin:12px 0 4px;font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.mping{margin:0;padding-left:1.1em;line-height:1.7}
.mpsteps{margin:0;padding-left:1.3em;line-height:1.55}.mpsteps li{margin-bottom:8px}
.mptoday{margin-top:16px;padding:12px 14px;border-radius:var(--r);background:var(--surface)}
.mptd{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;width:100%;padding:10px 0;border-top:1px solid var(--line);text-align:left;min-height:0}
.mptd small{font-size:.625rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mptd span{font-weight:600;line-height:1.3}
/* ---------- Plan à valider ---------- */
.plancard{margin-top:16px;padding:14px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--gold)}
.plancard .zlbl{display:block;margin:12px 0 2px;font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.plrow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.plrow.off .txt{opacity:.45;text-decoration:line-through}
/* ---------- Gummies ---------- */
.gumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.gum{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:14px;background:var(--surface);text-align:left;font-weight:600;font-size:.8125rem;min-height:0;box-shadow:inset 0 0 0 1px var(--line)}
.gum small{font-weight:500;font-size:.6875rem;color:var(--muted)}
.gum.in{background:var(--gold-soft)}.gum.in small{color:var(--gold)}.gum.on{box-shadow:inset 0 0 0 2px var(--gold)}
.gumcard{margin-top:12px;padding:14px;border-radius:var(--r);background:var(--surface)}
/* ---------- Thèmes ---------- */
.thgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.thsw{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:14px;background:var(--surface);text-align:left;font-size:.8125rem;font-weight:600;min-height:0;box-shadow:inset 0 0 0 1px var(--line)}
.thsw[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--gold)}
.thdots{display:flex;gap:4px}.thdots i{width:18px;height:18px;border-radius:50%}
.thpick{display:grid;gap:8px;margin-top:10px}
.thpick label{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:.875rem}
.thpick small{display:block;font-weight:500;font-size:.75rem;color:var(--muted)}
.thpick input[type=color]{flex:none;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;-webkit-appearance:none;appearance:none}
.thpick input[type=color]::-webkit-color-swatch-wrapper{padding:0}.thpick input[type=color]::-webkit-color-swatch{border:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
/* ---------- Zia · Modules ---------- */
.zhero{display:flex;align-items:center;gap:22px;margin-top:18px}
.zring{position:relative;width:132px;height:132px;flex:none}
.zring svg{width:100%;height:100%;display:block}
.zring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.zring b{font:400 2.4rem/1 var(--serif)}.zring b small{font-size:1.1rem;color:var(--muted)}
.zring span{font-size:.6875rem;font-weight:600;color:var(--muted);margin-top:4px;max-width:90px;line-height:1.25}
.zside{flex:1;min-width:0}
.zph{flex:1;display:flex;flex-direction:column;gap:6px}
.zph div{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;border-radius:12px;background:var(--surface);opacity:.55}
.zph div.cur{opacity:1;box-shadow:inset 0 0 0 1.5px var(--mint)}.zph div.ok{opacity:.8}
.zph b{font:400 1.15rem var(--serif)}.zph span{font-size:.6875rem;color:var(--muted)}
.zdays{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:16px}
.zdays i{aspect-ratio:1;border-radius:50%;background:var(--raise)}
.zdays i.half{background:color-mix(in srgb,var(--gold) 40%,var(--raise))}.zdays i.on{background:var(--gold)}
.zdays i.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--gold)}
.check.off{opacity:.5}
.zlbl{display:block;margin:14px 0 6px;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
textarea{width:100%;border:0;border-radius:14px;background:var(--surface);color:var(--ink);padding:12px 14px;font:inherit;resize:vertical}
textarea:focus{outline:2px solid var(--gold)}
.hstory{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.hstory button{aspect-ratio:1;border-radius:50%;background:var(--surface);min-height:0;padding:0;font-size:.6875rem;font-weight:600;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--orbit)}
.hstory button[aria-pressed="true"]{background:linear-gradient(135deg,var(--rose),var(--gold));color:var(--surface);box-shadow:none}
.hstory button:disabled{opacity:.35}
.hchart{display:block;width:100%;height:auto;margin-top:12px;overflow:visible}
.bpal{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.bp{border-radius:16px;background:var(--surface);overflow:hidden}
.bp.lock{opacity:.5}
.bph{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;min-height:54px}
.bph i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.8125rem;font-weight:700;background:var(--raise);color:var(--muted)}
.bph i svg{width:14px;height:14px;stroke:var(--surface);stroke-width:3;fill:none}
.bp.ok .bph i{background:var(--mint)}
.bp.open .bph i{background:var(--gold);color:var(--gold-ink)}
.bph b{flex:1;font-weight:600}
.bpb{padding:0 16px 16px}
.bpb ul{margin:0 0 10px;padding-left:1.1em;line-height:1.55}
.bpb textarea{background:var(--raise);margin-top:10px}
.bps{margin:0 0 10px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);font:400 1.05rem/1.4 var(--serif)}
.lvls{grid-template-columns:repeat(2,minmax(0,1fr))}
.lgrid.words{grid-template-columns:repeat(3,minmax(0,1fr))}
.ltile.lw{aspect-ratio:auto;padding:10px 4px;font-size:1.7rem}
.ltip4{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface);line-height:1.6}
/* ---------- Zia · Alphabet ---------- */
.lvls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:16px}
.lvls button{display:flex;flex-direction:column;gap:3px;padding:10px 10px 11px;border-radius:14px;background:var(--surface);text-align:left;min-height:0}
.lvls button b{font-size:.8125rem;font-weight:650}
.lvls button small{font-size:.6875rem;line-height:1.3;color:var(--muted)}
.lvls button[aria-pressed="true"]{background:var(--gold-soft);box-shadow:inset 0 0 0 1.5px var(--gold)}
.lvls button:disabled{opacity:.45}
.lgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:16px}
.ltile{aspect-ratio:1;border-radius:12px;background:var(--surface);display:grid;place-items:center;min-height:0;padding:0;font-family:var(--ar);font-size:1.55rem;line-height:1;color:var(--muted);transition:background .25s,color .25s,transform .15s var(--spring)}
.ltile span{transform:translateY(-.08em)}
.ltile.s1{color:var(--ink-2);box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--mint) 35%,transparent)}
.ltile.s2{color:var(--ink);box-shadow:inset 0 -3px 0 var(--mint)}
.ltile.s3{background:var(--mint-soft);color:var(--mint)}
.ltile.sel{box-shadow:inset 0 0 0 2px var(--gold)}
.ltile.off{opacity:.25}
.ltile:active{transform:scale(.92)}
.lcard{margin-top:14px;padding:16px;border-radius:var(--r);background:var(--surface)}
.lbig{margin:-6px 0 0;font:400 3.6rem/1.7 var(--ar);color:var(--gold);min-width:1.2em;text-align:center}
.lforms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px;direction:rtl}
.lforms div,.lsyl button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;background:var(--raise)}
.lforms span,.lsyl span{font:400 1.8rem/1.4 var(--ar)}
.lforms small,.lsyl small{font-size:.6875rem;color:var(--muted);direction:ltr}
.lsyl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px;direction:rtl}
.lsyl button{min-height:0}
.ltip{min-height:1.5em;margin:10px 0 0;text-align:left;line-height:1.5}
.ltip .ar{font-family:var(--ar)}
